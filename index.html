<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skala Prioritas Tugas</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="header">
    <div>
        <h1>Skala Prioritas</h1>
        <p>Pengatur tugas mahasiswa</p>
    </div>
</header>


<main class="container">

    <!-- Statistik -->
    <section class="stats">

        <div class="stat-card">
            <span class="stat-number" id="totalTasks">0</span>
            <span>Total Tugas</span>
        </div>

        <div class="stat-card">
            <span class="stat-number" id="activeTasks">0</span>
            <span>Tugas Aktif</span>
        </div>

        <div class="stat-card">
            <span class="stat-number" id="archivedTasks">0</span>
            <span>Arsip</span>
        </div>

    </section>


    <!-- Form tambah / edit -->
    <section class="task-form-section">

        <h2 id="formTitle">Tambah Tugas</h2>

        <form id="taskForm">

            <input type="hidden" id="taskId">

            <div class="form-group">
                <label for="taskName">Nama Tugas</label>

                <input
                    type="text"
                    id="taskName"
                    placeholder="Contoh: Laporan Praktikum"
                    required
                >
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="deadline">Deadline</label>

                    <input
                        type="date"
                        id="deadline"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="weight">Bobot</label>

                    <input
                        type="number"
                        id="weight"
                        min="1"
                        max="100"
                        value="50"
                        required
                    >
                </div>

            </div>


            <div class="form-group">
                <label for="description">Keterangan</label>

                <textarea
                    id="description"
                    rows="3"
                    placeholder="Keterangan tugas (opsional)"
                ></textarea>
            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="submitButton">
                    Tambah Tugas
                </button>

                <button
                    type="button"
                    class="btn btn-secondary hidden"
                    id="cancelEdit">
                    Batal
                </button>

            </div>

        </form>

    </section>


    <!-- Daftar tugas -->
    <section class="task-section">

        <div class="section-header">

            <h2>Tugas Aktif</h2>

            <button
                class="btn btn-secondary"
                id="sortDeadline">
                Urutkan Deadline
            </button>

        </div>


        <div id="taskList" class="task-list"></div>

        <div
            id="emptyMessage"
            class="empty-message">
            Belum ada tugas.
        </div>

    </section>


    <!-- Arsip -->
    <section class="task-section archive-section">

        <div class="section-header">

            <h2>Arsip Tugas</h2>

        </div>

        <div
            id="archiveList"
            class="task-list">
        </div>

        <div
            id="emptyArchive"
            class="empty-message">
            Belum ada tugas yang diarsipkan.
        </div>

    </section>

</main>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
